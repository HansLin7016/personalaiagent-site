<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名片助理</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2933; --muted:#52606d; --accent:#1f5fae; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --fg:#e4e7eb; --muted:#9aa5b1; --accent:#7fb0ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.7; }
  main { max-width:720px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 8px; font-size:28px; }
  p, li { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>名片助理</h1>
  <p>名片助理是公司內部使用的 AI 助理功能：同仁在通訊軟體（Telegram／WhatsApp）傳送名片照片後，系統辨識名片內容並建檔，經同仁授權後，將聯絡人新增到同仁本人的手機通訊錄（Google 通訊錄或 iCloud）。</p>
  <ul>
    <li>僅供公司內部同仁使用，不對外提供服務。</li>
    <li>只會「新增」聯絡人，不會讀取後轉作他用、修改或刪除使用者既有的聯絡人。</li>
    <li>使用者可隨時停用並撤銷授權。</li>
  </ul>
  <p><a href="privacy.html">隱私權政策</a></p>
</main>
</body>
</html>
